version: '3.8'

services:
  api:
    build: .
    image: llm-lora-inference:latest
    container_name: llm-api
    ports:
      - "8000:8000"
    volumes:
      - ./outputs/merged-model:/app/models/deployed-model:ro
    environment:
      - MODEL_PATH=/app/models/deployed-model
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Optional: Add nginx reverse proxy
